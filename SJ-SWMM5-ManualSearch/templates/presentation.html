<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SWMM5 Manual Search — Presentation</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#0a1929;color:#d4e4f4;height:100vh;width:100vw;display:flex;flex-direction:column;overflow:hidden}
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1.2rem;background:rgba(10,25,41,.95);border-bottom:1px solid rgba(79,195,247,.15);flex-shrink:0;z-index:10}
    .top-bar h1{font-size:.95rem;font-weight:600;color:#90caf9;display:flex;align-items:center;gap:.5rem}
    .top-bar h1 span{font-size:1.2rem}
    .bar-actions{display:flex;gap:.5rem}
    .bar-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#90caf9;padding:.3rem .8rem;border-radius:20px;cursor:pointer;font-size:.78rem;font-family:inherit;transition:background .2s;text-decoration:none;display:inline-flex;align-items:center}
    .bar-btn:hover{background:rgba(255,255,255,.2)}
    .viewer{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:.5rem}
    .slide-container{position:relative;max-width:960px;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .slide-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);transition:opacity .4s ease}
    .slide-img.fade{opacity:0}
    .nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#d4e4f4;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:background .2s;z-index:5}
    .nav-btn:hover{background:rgba(255,255,255,.25)}
    .nav-btn:disabled{opacity:.3;cursor:default}
    .nav-btn.prev{left:.8rem}
    .nav-btn.next{right:.8rem}
    .bottom-bar{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.5rem;background:rgba(10,25,41,.95);border-top:1px solid rgba(79,195,247,.15);flex-shrink:0}
    .slide-counter{font-size:.82rem;color:#7aa8c8;min-width:80px;text-align:center}
    .slide-dots{display:flex;gap:5px;align-items:center}
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .2s}
    .dot.active{background:#4fc3f7;width:20px;border-radius:4px}
    .progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,#4fc3f7,#00bcd4);z-index:10;transition:width .3s}
    @media(max-width:600px){
      .top-bar{flex-direction:column;gap:.3rem;text-align:center;padding:.4rem .8rem}
      .nav-btn{width:36px;height:36px;font-size:1rem}
      .nav-btn.prev{left:.3rem}
      .nav-btn.next{right:.3rem}
      .bar-actions{flex-wrap:wrap;justify-content:center}
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="top-bar">
    <h1><span>&#127754;</span> SWMM5 Manual Search — Presentation</h1>
    <div class="bar-actions">
      <a class="bar-btn" href="/static/SWMM5_Manual_Search_Complete_App_Overview.pptx" download>Download PPTX</a>
      <a class="bar-btn" href="/intro">Intro Video</a>
      <a class="bar-btn" href="/">Back to App</a>
    </div>
  </div>
  <div class="viewer">
    <button class="nav-btn prev" id="prev-btn" title="Previous slide">&#9664;</button>
    <div class="slide-container">
      <img class="slide-img" id="slide-img" src="/static/slides/slide-01.png" alt="Slide 1" draggable="false"/>
    </div>
    <button class="nav-btn next" id="next-btn" title="Next slide">&#9654;</button>
  </div>
  <div class="bottom-bar">
    <span class="slide-counter" id="counter">1 / {{ slide_count }}</span>
    <div class="slide-dots" id="dots"></div>
  </div>
  <script>
    const TOTAL = {{ slide_count }};
    const slides = [];
    for (let i = 1; i <= TOTAL; i++) {
      slides.push('/static/slides/slide-' + String(i).padStart(2, '0') + '.png');
    }

    let current = 0;
    const img = document.getElementById('slide-img');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const dotsEl = document.getElementById('dots');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    for (let i = 0; i < TOTAL; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    }

    for (let i = 1; i < TOTAL; i++) {
      const preload = new Image();
      preload.src = slides[i];
    }

    function goTo(index) {
      if (index < 0 || index >= TOTAL) return;
      img.classList.add('fade');
      setTimeout(() => {
        current = index;
        img.src = slides[current];
        img.alt = 'Slide ' + (current + 1);
        counter.textContent = (current + 1) + ' / ' + TOTAL;
        progress.style.width = ((current + 1) / TOTAL * 100) + '%';
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === TOTAL - 1;
        dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
        img.classList.remove('fade');
      }, 200);
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
      if (e.key === 'ArrowLeft') { goTo(current - 1); }
      if (e.key === 'Escape') window.location.href = '/';
      if (e.key === 'Home') goTo(0);
      if (e.key === 'End') goTo(TOTAL - 1);
    });

    let touchX = 0;
    document.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; });
    document.addEventListener('touchend', (e) => {
      const diff = touchX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) goTo(current + 1);
        else goTo(current - 1);
      }
    });

    prevBtn.disabled = true;
    progress.style.width = (1 / TOTAL * 100) + '%';
  </script>
</body>
</html>
